<svg xmlns="http://www.w3.org/2000/svg" width="900" height="366" viewBox="0 0 900 366" role="img" aria-label="raceloom output: a stale-response race found and shrunk to one out-of-order step">
<style>
  .bg { fill: #0d1117; }
  .bar { fill: #161b22; }
  .l { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #c9d1d9; opacity: 0; animation: in .25s ease-out forwards; }
  .cmd { fill: #8b949e; }
  .fail { fill: #ff7b72; font-weight: 600; }
  .hot { fill: #e3b341; font-weight: 600; }
  .call { fill: #79c0ff; }
  .ret { fill: #7ee787; }
  .replay { fill: #d2a8ff; }
  .dim { fill: #c9d1d9; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } }
</style>
<rect class="bg" width="900" height="366" rx="10"/>
<rect class="bar" width="900" height="30" rx="10"/>
<rect class="bar" y="20" width="900" height="10"/>
<circle cx="20" cy="15" r="6" fill="#ff5f56"/><circle cx="40" cy="15" r="6" fill="#ffbd2e"/><circle cx="60" cy="15" r="6" fill="#27c93f"/>
  <text x="24" y="52" class="l cmd" style="animation-delay:0.00s" xml:space="preserve">$ node --test examples/search-box.test.js</text>
  <text x="24" y="73" class="l " style="animation-delay:0.35s" xml:space="preserve"></text>
  <text x="24" y="94" class="l fail" style="animation-delay:0.70s" xml:space="preserve">✖ search box shows results for the latest query</text>
  <text x="24" y="115" class="l fail" style="animation-delay:1.00s" xml:space="preserve">RaceError: AssertionError: showing ["rust","rce"] for query "ra"</text>
  <text x="24" y="136" class="l dim" style="animation-delay:1.16s" xml:space="preserve"></text>
  <text x="24" y="157" class="l dim" style="animation-delay:1.32s" xml:space="preserve">raceloom found a failing interleaving on schedule #2 (exhaustive, seed 1).</text>
  <text x="24" y="178" class="l dim" style="animation-delay:1.48s" xml:space="preserve">Minimal reproduction: 1 out-of-order step.</text>
  <text x="24" y="199" class="l dim" style="animation-delay:1.64s" xml:space="preserve"></text>
  <text x="24" y="220" class="l call" style="animation-delay:1.80s" xml:space="preserve">1  keystroke 1 │ → api.search('r')</text>
  <text x="24" y="241" class="l call" style="animation-delay:1.96s" xml:space="preserve">2  keystroke 2 │ → api.search('ra')</text>
  <text x="24" y="262" class="l hot" style="animation-delay:2.12s" xml:space="preserve">3  keystroke 2 │ ← api.search('ra') = [ 'raust', 'race' ]   ⚡ overtook 1 earlier pending op</text>
  <text x="24" y="283" class="l ret" style="animation-delay:2.28s" xml:space="preserve">4  keystroke 1 │ ← api.search('r') = [ 'rust', 'rce' ]</text>
  <text x="24" y="304" class="l dim" style="animation-delay:2.44s" xml:space="preserve"></text>
  <text x="24" y="325" class="l replay" style="animation-delay:2.60s" xml:space="preserve">Replay exactly: explore(fn, { replay: "1:1" })</text>
</svg>
